name: ahras-prod

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-AHRAS_DB}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]
    security_opt: [no-new-privileges:true]
    pids_limit: 300
    mem_limit: 1g

  ahras:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      AHRAS_HOST: 0.0.0.0
      AHRAS_PORT: 8000
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin&retryWrites=true&w=majority
      MONGO_DB: ${MONGO_DB:-AHRAS_DB}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./reports:/app/reports
    expose: [8000]
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [frontend, backend]
    security_opt: [no-new-privileges:true]
    pids_limit: 500
    mem_limit: 2g
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      ahras:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks: [frontend]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m

  # Run backups on demand:
  # docker compose -f docker-compose.prod.yml run --rm backup
  backup:
    image: mongo:7
    profiles: [backup]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_DB: ${MONGO_DB:-AHRAS_DB}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    networks: [backend]

volumes:
  mongo_data:
  mongo_config:

networks:
  frontend:
  backend:
    internal: true
