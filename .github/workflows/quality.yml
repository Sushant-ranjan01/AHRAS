name: AHRAS Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q .
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Mypy
        if: matrix.python-version == '3.11'
        run: mypy auth api security rbac database detection risk_engine risk_explainer xai observability
      - name: Tests + coverage
        run: pytest -q --disable-warnings --cov=. --cov-report=term-missing --cov-report=xml
      - name: Security static analysis
        if: matrix.python-version == '3.11'
        run: bandit -r . -x ./venv,./.venv,./tests -ll
      - name: Dependency vulnerability audit
        if: matrix.python-version == '3.11'
        run: pip-audit -r requirements.txt
      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
