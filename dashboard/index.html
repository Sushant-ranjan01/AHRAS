<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AHRAS SOC v2</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0D1117;--surface:#161B22;--card:#1C2128;--border:#2D333B;
  --text:#CDD9E5;--muted:#768390;--accent:#4A90D9;
  --green:#3FB950;--yellow:#D29922;--orange:#E3671C;--red:#F85149;
  --radius:8px;--font:'Segoe UI',system-ui,sans-serif;
}
/* Light theme — toggled by adding data-theme="light" to <html> (see
   toggleTheme() near the bottom of this file). Same variable names, so
   every existing rule below repaints automatically with no other changes. */
html[data-theme="light"]{
  --bg:#F6F8FA;--surface:#FFFFFF;--card:#FFFFFF;--border:#D0D7DE;
  --text:#1F2328;--muted:#57606A;--accent:#0969DA;
  --green:#1A7F37;--yellow:#9A6700;--orange:#BC4C00;--red:#CF222E;
}
html[data-theme="light"] .login-box,
html[data-theme="light"] .card{box-shadow:0 1px 3px #1f232814}
html[data-theme="light"] .b-LOW{background:#1a7f3718}
html[data-theme="light"] .b-MEDIUM{background:#9a670018}
html[data-theme="light"] .b-HIGH{background:#bc4c0018}
html[data-theme="light"] .b-CRITICAL{background:#cf222e18}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;min-height:100vh}
/* ── Login ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:48px 40px;width:380px;text-align:center}
.login-logo{font-size:28px;font-weight:800;color:var(--accent);letter-spacing:-0.5px;margin-bottom:4px}
.login-sub{color:var(--muted);font-size:12px;margin-bottom:32px}
.login-box input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:10px 14px;font-size:13px;margin-bottom:12px;outline:none}
.login-box input:focus{border-color:var(--accent)}
.btn-login{width:100%;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-login:hover{background:#5a9fde}
.login-error{color:var(--red);font-size:12px;margin-top:10px;min-height:18px}
/* ── App layout (left sidebar) ── */
#app{display:none;min-height:100vh}
/* Sidebar (was: top header bar) — fixed so it always spans the full viewport
   height, independent of how tall the page content grows. Previously this
   was `position:sticky` inside a flex row, which loses its stick once the
   overflow-x:hidden on html/body clips the scrolling context: the sidebar
   would render its own height then just end while the page kept scrolling
   underneath it. Fixed positioning removes that ambiguity entirely. */
.sidebar{background:var(--surface);border-right:1px solid var(--border);width:216px;flex-shrink:0;display:flex;flex-direction:column;height:100vh;position:fixed;top:0;left:0;z-index:200;transition:transform .2s ease}
.sidebar-brand{display:flex;align-items:center;gap:8px;padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.hdr-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px #3fb95030;flex-shrink:0}
.hdr-title{font-weight:800;font-size:15px;letter-spacing:-0.3px;line-height:1.3}
.hdr-sub{color:var(--muted);font-size:10px;letter-spacing:.1em}
.hdr-tabs{display:flex;flex-direction:column;gap:2px;padding:8px;overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.hdr-tabs::-webkit-scrollbar{width:4px}
.hdr-tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tab-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px;padding:9px 12px;text-align:left;border-radius:6px;border-left:3px solid transparent;transition:.15s;white-space:nowrap;width:100%}
.tab-btn:hover{background:#ffffff08;color:var(--text)}
.tab-btn.active{color:var(--text);font-weight:600;border-left-color:var(--accent);background:#4a90d918}
.hdr-right{display:flex;flex-direction:column;gap:10px;align-items:stretch;flex-shrink:0;padding:14px 16px;border-top:1px solid var(--border)}
.hdr-right .pill-btn{width:100%}
/* Hamburger toggle + overlay, shown only on narrow screens */
.mobile-menu-btn{display:none;position:fixed;top:12px;left:12px;z-index:300;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;width:36px;height:36px;font-size:16px;cursor:pointer}
.sidebar-overlay{display:none}
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:0 0 40px #0009}
  .sidebar.open{transform:translateX(0)}
  .mobile-menu-btn{display:block}
  .sidebar-overlay.show{display:block;position:fixed;inset:0;background:#0008;z-index:199}
  .sysbar{padding-left:58px}
  .content-col{margin-left:0}
}
/* Right-hand column that holds the sysbar + page content. Offset by the
   fixed sidebar's width on desktop; full-width under the sidebar on mobile
   (see media query above), where the sidebar slides over as an overlay. */
.content-col{display:flex;flex-direction:column;min-height:100vh;margin-left:216px}
.pill-btn{background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px;font-weight:600}
.pill-btn.accent{background:#4a90d920;color:var(--accent);border-color:#4a90d950}
.pill-btn.green{background:#3fb95020;color:var(--green);border-color:#3fb95050}
.pill-btn.red{background:#f8514920;color:var(--red);border-color:#f8514950}
.theme-toggle{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:12px;font-weight:600}
.theme-toggle:hover{color:var(--text);border-color:var(--accent)}
/* Sysbar */
.sysbar{background:var(--surface);border-bottom:1px solid var(--border);padding:5px 20px;display:flex;gap:24px;font-size:11px;align-items:center}
.sysbar span.k{color:var(--muted)}
.sysbar span.v{font-family:monospace;color:var(--text)}
/* Main */
.main{padding:18px 20px;flex:1}
/* Panels */
.panel{display:none}.panel.active{display:block}
/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.card-title{color:var(--text);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;border-left:3px solid var(--accent);padding-left:9px;margin-bottom:14px}
/* Grid helpers */
.row{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.row>.card{flex:1;min-width:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
/* Stat cards */
.stat-val{font-size:30px;font-weight:800;line-height:1}
.stat-sub{color:var(--muted);font-size:11px;margin-top:5px}
/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:7px 12px;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
td{padding:7px 12px;border-bottom:1px solid #2d333b20;font-size:12px}
tr:hover td{background:#ffffff05}
/* Badges */
.badge{border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700}
.b-LOW{background:#3fb95022;color:var(--green)}
.b-MEDIUM{background:#d2992222;color:var(--yellow)}
.b-HIGH{background:#e3671c22;color:var(--orange)}
.b-CRITICAL{background:#f8514922;color:var(--red)}
.b-OPEN{background:#4a90d920;color:var(--accent)}
.b-ACKNOWLEDGED{background:#3fb95020;color:var(--green)}
.b-RESOLVED{background:#76839020;color:var(--muted)}
.b-ESCALATED{background:#f8514920;color:var(--red)}
/* Toggle switch */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:none}
.toggle-label{font-size:13px}
.toggle-desc{font-size:11px;color:var(--muted);margin-top:2px}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#444c56;border-radius:24px;transition:.3s}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked+.slider{background:var(--accent)}
input:checked+.slider:before{transform:translateX(20px)}
/* Forms */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.form-group input,.form-group textarea,.form-group select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 12px;font-size:13px;outline:none;font-family:var(--font)}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:none;border-radius:6px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#5a9fde}
.btn-danger{background:var(--red);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-sm{padding:4px 10px;font-size:11px}
/* Popup */
#popup-container{position:fixed;top:70px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:340px}
.popup{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;pointer-events:all;animation:slideIn .25s ease;box-shadow:0 8px 24px #0008}
.popup.critical{border-left:3px solid var(--red)}
.popup.high{border-left:3px solid var(--orange)}
.popup.medium{border-left:3px solid var(--yellow)}
.popup-title{font-weight:700;font-size:13px;margin-bottom:4px}
.popup-msg{font-size:12px;color:var(--muted);line-height:1.5}
.popup-close{float:right;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;margin-top:-2px}
.popup-actions{display:flex;gap:8px;margin-top:10px}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
/* Notif bell */
.notif-bell{position:relative;cursor:pointer}
.notif-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
/* Risk bar */
.risk-bar-wrap{background:var(--border);border-radius:4px;height:6px;margin-top:4px}
.risk-bar{height:100%;border-radius:4px;transition:width .4s}
/* Scrollable log */
.log-box{height:160px;overflow-y:auto;font-family:monospace;font-size:11px}
.log-line{padding:2px 0;border-bottom:1px solid #ffffff08}
/* Role badge */
.role-master{background:#4a90d920;color:var(--accent);border:1px solid #4a90d940;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700}
.role-analyst{background:#3fb95020;color:var(--green);border:1px solid #3fb95040;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700}
/* Separator */
.sep{height:1px;background:var(--border);margin:16px 0}
canvas{max-height:200px}
.chart-wrap{position:relative;height:200px}
/* ── Narrative section dividers (dashboard restructure) ── */
.section-divider{display:flex;align-items:center;gap:10px;margin:22px 0 12px;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.section-divider::after{content:'';flex:1;height:1px;background:var(--border)}
/* ── Pill badges (severity, reputation) ── */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
/* ── KPI cards with trend ── */
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;flex:1;min-width:130px;cursor:pointer;transition:border-color .15s}
.kpi-card:hover{border-color:var(--accent)}
.kpi-label{color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.kpi-val{font-size:26px;font-weight:800;line-height:1}
.kpi-trend{font-size:11px;margin-top:6px}
/* ── Risk mini bar (inline, next to a risk number) ── */
.risk-mini-wrap{width:52px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:7px}
.risk-mini-bar{height:100%;border-radius:3px;transition:width .4s}
/* ── IP as primary object ── */
.ip-cell{cursor:pointer}
.ip-cell .ip-main{font-family:monospace;font-weight:700;color:var(--text)}
.ip-cell:hover .ip-main{color:var(--accent);text-decoration:underline}
.ip-cell .ip-org{color:var(--muted);font-size:10.5px;margin-top:1px}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0}
/* ── Row action menu (⋮) instead of a Block button on every row ── */
.action-menu-wrap{position:relative;display:inline-block}
.action-menu-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;width:26px;height:24px;cursor:pointer;font-size:14px;line-height:1}
.action-menu-btn:hover{color:var(--text);border-color:var(--accent)}
.action-menu{position:absolute;right:0;top:28px;background:var(--card);border:1px solid var(--border);border-radius:8px;min-width:160px;box-shadow:0 8px 24px #000a;z-index:80;overflow:hidden;display:none}
.action-menu.show{display:block}
.action-menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 12px;font-size:12px;cursor:pointer}
.action-menu button:hover{background:#ffffff0a}
.action-menu button.danger{color:var(--red)}
/* ── Widget lists (Top Threat Sources / Top Attack Types) ── */
.mini-list-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #2d333b30;cursor:pointer}
.mini-list-row:last-child{border-bottom:none}
.mini-list-row:hover{background:#ffffff05}
.mini-list-rank{color:var(--muted);font-size:11px;width:16px;display:inline-block}
/* ── Overlay modal (IP Intelligence / Event Detail) — matches Case Detail styling ── */
.ov-backdrop{position:fixed;inset:0;background:#000a;z-index:900;display:flex;align-items:center;justify-content:center;padding:20px}
.ov-box{background:var(--card);border:1px solid var(--border);border-radius:12px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:26px}
.ai-analysis{background:#4a90d90d;border:1px solid #4a90d940;border-radius:8px;padding:14px;margin-top:14px;font-size:12px;line-height:1.7}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">AHRAS</div>
    <div class="login-sub">Adaptive Hybrid Risk-Aware Security System</div>
    <input type="text" id="login-user" placeholder="Username" value="admin"/>
    <input type="password" id="login-pass" placeholder="Password" value="Admin@123"/>
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-err"></div>
    <div style="margin-top:20px;font-size:11px;color:var(--muted);line-height:1.8">
      Master: admin / Admin@123<br>Analyst: analyst / Analyst@123
    </div>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app">
  <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="toggleSidebar()" title="Menu">☰</button>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar: brand + module nav + user/actions -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="hdr-dot"></div>
      <div><div class="hdr-title">AHRAS</div><div class="hdr-sub">SOC v2</div></div>
    </div>
    <div class="hdr-tabs" id="hdr-tabs"></div>
    <div class="hdr-right">
      <!-- Notification bell -->
      <div class="notif-bell" onclick="openNotifications()" title="Notifications">
        <svg width="20" height="20" fill="none" stroke="#768390" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <div class="notif-badge" id="notif-count" style="display:none">0</div>
      </div>
      <!-- Theme toggle -->
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle light / dark mode">
        <span id="theme-icon">🌙</span><span id="theme-label">Dark</span>
      </button>
      <span id="hdr-user" style="font-size:12px;color:var(--muted)"></span>
      <span id="hdr-role"></span>
      <button class="pill-btn accent" onclick="dlReport()">↓ Report</button>
      <button class="pill-btn red" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <!-- Right column: sysbar + page content -->
  <div class="content-col">
    <div class="sysbar">
      <span><span class="k">HOST </span><span class="v" id="sb-host">DESKTOP-G1S4QIB</span></span>
      <span><span class="k">IP </span><span class="v">10.0.1.138</span></span>
      <span><span class="k">ENGINE </span><span class="v">Hybrid IDS + ML + Ransomware + AV</span></span>
      <span><span class="k">FIREWALL </span><span class="v" id="sb-fw">OFF (DRY-RUN)</span></span>
      <span style="margin-left:auto;font-size:11px;color:var(--muted)" id="sb-time"></span>
    </div>

    <div class="main" id="main-content">
      <!-- panels injected here -->
    </div>
  </div>
</div>

<!-- Popup container -->
<div id="popup-container"></div>

<script>
// ════════════════════════════════════════════════
// THEME (dark / light) — applied immediately, before login, so the login
// screen itself respects the saved preference too.
// ════════════════════════════════════════════════
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const icon = document.getElementById('theme-icon');
  const label = document.getElementById('theme-label');
  if (icon) icon.textContent = theme === 'light' ? '☀️' : '🌙';
  if (label) label.textContent = theme === 'light' ? 'Light' : 'Dark';
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = current === 'light' ? 'dark' : 'light';
  localStorage.setItem('ahras_theme', next);
  applyTheme(next);
}
(function initTheme() {
  const saved = localStorage.getItem('ahras_theme');
  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  applyTheme(saved || (prefersLight ? 'light' : 'dark'));
})();

// ════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════
const S = {
  token: null, role: null, username: null,
  events: [], stats: {severity_counts:{},attack_type_counts:{},protocol_counts:{},risk_trend:[]},
  prevStats: null,
  fwStatus: null, charts: {}, liveOn: true,
};
let _feedEvents = []; // events currently rendered in the live feed table, indexed for openEventModal(i)
const API = (p) => `/api${p}`;
const hdrs = () => ({ 'Content-Type':'application/json', 'Authorization': S.token ? `Bearer ${S.token}` : '' });

async function apiFetch(path, opts={}) {
  const res = await fetch(API(path), { headers: hdrs(), ...opts });
  if (res.status === 401) { doLogout(); return null; }
  if (!res.ok) { const e = await res.json().catch(()=>({detail:'Error'})); showPopup(e.detail||'Error','CRITICAL'); return null; }
  return res.json();
}

// ════════════════════════════════════════════════
// AUTH
// ════════════════════════════════════════════════
async function doLogin() {
  const u = document.getElementById('login-user').value;
  const p = document.getElementById('login-pass').value;
  const form = new URLSearchParams(); form.append('username',u); form.append('password',p);
  try {
    const res = await fetch('/api/auth/login', { method:'POST', body: form });
    if (res.status === 429) {
      const e = await res.json().catch(()=>({detail:'Too many attempts — try again later.'}));
      document.getElementById('login-err').textContent = e.detail;
      return;
    }
    if (!res.ok) { document.getElementById('login-err').textContent='Invalid credentials'; return; }
    const d = await res.json();
    S.token = d.access_token; S.role = d.role; S.username = d.username;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
    if (d.must_change_password) showForcePasswordChangeModal();
  } catch { document.getElementById('login-err').textContent = 'Connection error'; }
}

// ── Forced password change (seeded default accounts) ──────────────────────
function showForcePasswordChangeModal() {
  if (document.getElementById('force-pw-modal')) return;
  const el = document.createElement('div');
  el.className = 'ov-backdrop';
  el.id = 'force-pw-modal';
  el.innerHTML = `
    <div class="ov-box" style="max-width:420px">
      <h3 style="margin:0 0 6px">⚠️ Change Your Password</h3>
      <p style="font-size:12px;color:var(--muted);margin:0 0 16px">
        You're signed in with a default seeded account (<code>${S.username}</code>). These

      <input type="password" id="fpw-confirm" placeholder="Confirm new password" style="width:100%;margin-bottom:10px;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text)">

        <button class="btn btn-sm btn-primary" onclick="submitPasswordChange()">Change Password</button>
      </div>
    </div>`;
  document.body.appendChild(el);
}
async function submitPasswordChange() {
  const oldP = document.getElementById('fpw-old').value;
  const newP = document.getElementById('fpw-new').value;
  const confP = document.getElementById('fpw-confirm').value;
  const err = document.getElementById('fpw-err');
  if (!oldP || !newP) { err.textContent = 'Fill in both fields.'; return; }
  if (newP.length < 8) { err.textContent = 'New password must be at least 8 characters.'; return; }
  if (newP !== confP) { err.textContent = "New password and confirmation don't match."; return; }
  const res = await fetch('/api/auth/change-password', {
    method:'POST', headers: hdrs(),
    body: JSON.stringify({ old_password: oldP, new_password: newP }),
  });
  if (!res.ok) {
    const e = await res.json().catch(()=>({detail:'Change failed'}));
    err.textContent = e.detail || 'Change failed';
    return;
  }
  document.getElementById('force-pw-modal').remove();
  showPopup('Password changed. Use your new password next time you sign in.', 'LOW');
}

// CAPTURE STATUS — tells you WHY the live feed is empty
// instead of it just silently sitting there with 0 rows.
// ════════════════════════════════════════════════
async function checkCaptureStatus() {
  const banner = document.getElementById('capture-banner');
  if (!banner) return; // not on dashboard tab
  const d = await apiFetch('/capture-status');
  if (!d) return;
  if (d.packets_captured > 0) { banner.style.display = 'none'; return; }

  let msg = '⚠ No packets captured yet — live feed is empty. ';
  if (!d.scapy_available) {
    msg += 'Scapy is not installed/importable on the server. Run: pip install scapy';
  } else if (d.running_as_admin_or_root === false) {
    msg += 'The server process is NOT running as Administrator/root — raw packet capture needs elevated privileges. Fully close the app and re-launch cmd/PowerShell via "Run as administrator", then start it again from that window.';
  } else if (!d.interfaces_detected || d.interfaces_detected.length === 0) {
    msg += 'No network interfaces were detected by scapy. On Windows this almost always means Npcap is not installed — install it from https://npcap.com/ and check "WinPcap API-compatible Mode" during setup.';
  } else if (d.interface_configured) {
    msg += `Configured interface "${d.interface_configured}" may be wrong or has no traffic. Detected interfaces: ${d.interfaces_detected.join(', ')}. Try clearing NETWORK_INTERFACE in .env or setting it to the right adapter.`;
  } else {
    msg += `Using the default interface, but 0 packets seen so far. Try generating some traffic (browse a site) and wait a few seconds. Detected interfaces: ${d.interfaces_detected.join(', ')}.`;
  }
  banner.textContent = msg;
  banner.style.display = 'block';
}

    // Template fallback — still fully grounded, just not LLM-phrased.

      <p><b>What's happening:</b> ${escapeHtml(s.whats_happening||'')}</p>
      <p><b>Why:</b> ${escapeHtml(s.why||'')}</p>
      <p><b>What you need to do:</b> ${escapeHtml(s.what_to_do||'')}</p>`;

}

// ── small render helpers reused across the dashboard ──
function sevPill(sev) {
  const c = {LOW:'var(--green)',MEDIUM:'var(--yellow)',HIGH:'var(--orange)',CRITICAL:'var(--red)'}[sev]||'var(--muted)';
  return `<span class="pill" style="background:${c}20;color:${c}"><span class="pill-dot" style="background:${c}"></span>${sev}</span>`;
}
function riskMini(v) {
  const val = Math.min(v||0, 10);
  const pct = Math.max(2, val*10);
  const c = val>=7?'var(--red)':val>=4?'var(--orange)':val>=2?'var(--yellow)':'var(--green)';
  return `<span style="font-weight:700;color:${c}">${val.toFixed(1)}<span style="color:var(--muted);font-weight:400">/10</span></span>
          <span class="risk-mini-wrap"><span class="risk-mini-bar" style="width:${pct}%;background:${c}"></span></span>`;
}
// Compares current vs previous poll and returns a small trend readout. Real delta, not fabricated.
function trendReadout(curr, prev) {
  if (prev===undefined || prev===null) return `<span style="color:var(--muted)">since last check: —</span>`;
  const diff = curr - prev;
  if (diff===0) return `<span style="color:var(--muted)">─ steady since last check</span>`;
  const pct = prev ? Math.round(Math.abs(diff/prev*100)) : null;
  const arrow = diff>0 ? '↑' : '↓';
  const color = diff>0 ? 'var(--red)' : 'var(--green)';
  return `<span style="color:${color}">${arrow} ${Math.abs(diff)}${pct!==null?` (${pct}%)`:''} since last check</span>`;
}
function kpiCard(label, value, color, trendHtml, onclick) {
  return `<div class="kpi-card" ${onclick?`onclick="${onclick}"`:''}>
    <div class="kpi-label">${label}</div>
    <div class="kpi-val" style="color:${color}">${value}</div>
    <div class="kpi-trend">${trendHtml||''}</div>
  </div>`;
}

function updateDashboardLive() {
  const sc = S.stats.severity_counts || {};
  const prevSc = (S.prevStats && S.prevStats.severity_counts) || {};
  const total = S.events.length;

  // ── KPI ROW 1: severity counts, each with a real since-last-poll delta ──
  const kr1 = document.getElementById('kpi-row-1');
  if (kr1) {
    kr1.innerHTML =
      kpiCard('Total Events', total, 'var(--text)', trendReadout(total, (S.prevStats&&S.prevStats.total_events))) +
      kpiCard('Low', sc.LOW||0, 'var(--green)', trendReadout(sc.LOW||0, prevSc.LOW), "filterEventsBySeverity('LOW')") +
      kpiCard('Medium', sc.MEDIUM||0, 'var(--yellow)', trendReadout(sc.MEDIUM||0, prevSc.MEDIUM), "filterEventsBySeverity('MEDIUM')") +
      kpiCard('High', sc.HIGH||0, 'var(--orange)', trendReadout(sc.HIGH||0, prevSc.HIGH), "filterEventsBySeverity('HIGH')") +
      kpiCard('Critical', sc.CRITICAL||0, 'var(--red)', trendReadout(sc.CRITICAL||0, prevSc.CRITICAL), "filterEventsBySeverity('CRITICAL')");
  }

  // ── KPI ROW 2: SOC counters, each with real since-last-poll delta + click-through ──
  const corrStats = S.stats.correlation_stats||{};
  const hpStats   = S.stats.honeypot_stats||{};
  const iocStats  = S.stats.ioc_stats||{};
  const caseStats = S.stats.case_stats||{};
  const tiStats   = S.stats.threat_intel_stats||{};
  const assetStats= S.stats.asset_stats||{};
  const pCorr = (S.prevStats&&S.prevStats.correlation_stats)||{};
  const pHp   = (S.prevStats&&S.prevStats.honeypot_stats)||{};
  const pIoc  = (S.prevStats&&S.prevStats.ioc_stats)||{};
  const pCase = (S.prevStats&&S.prevStats.case_stats)||{};
  const pTi   = (S.prevStats&&S.prevStats.threat_intel_stats)||{};
  const kr2 = document.getElementById('kpi-row-2');
  if (kr2) {
    kr2.innerHTML =
      kpiCard('Correlated Incidents', corrStats.unacknowledged||0, 'var(--accent)', trendReadout(corrStats.unacknowledged||0, pCorr.unacknowledged), "switchTab('correlation')") +
      kpiCard('Open Cases', caseStats.open||0, 'var(--yellow)', trendReadout(caseStats.open||0, pCase.open), "switchTab('cases')") +
      kpiCard('Active IOCs', iocStats.total||0, 'var(--green)', trendReadout(iocStats.total||0, pIoc.total), "switchTab('ioc')") +
      kpiCard('Honeypot Hits', hpStats.total_hits||0, 'var(--orange)', trendReadout(hpStats.total_hits||0, pHp.total_hits), "switchTab('honeypot')") +
      kpiCard('TI Lookups', tiStats.lookups||0, 'var(--accent)', trendReadout(tiStats.lookups||0, pTi.lookups), "switchTab('threat-intel')") +
      kpiCard('Protected Assets', assetStats.total||0, 'var(--muted)', '', "switchTab('assets')");
  }

  // ── Risk Score Trend chart + readout (current / peak / change / trend direction) ──
  const trend = S.stats.risk_trend || [];
  if (S.charts.risk) {
    S.charts.risk.data.labels = trend.map(t=>t.time);
    S.charts.risk.data.datasets[0].data = trend.map(t=>t.risk);
    S.charts.risk.update('none');
  }
  const rts = document.getElementById('risk-trend-stats');
  if (rts) {
    if (trend.length) {
      const cur = trend[trend.length-1].risk;
      const peak = Math.max(...trend.map(t=>t.risk));
      const first = trend[0].risk;
      const change = first ? Math.round((cur-first)/first*100) : 0;
      const dir = cur>first ? 'Escalating' : cur<first ? 'Cooling down' : 'Flat';
      const dirColor = cur>first ? 'var(--red)' : cur<first ? 'var(--green)' : 'var(--muted)';
      rts.innerHTML = `
        <div style="flex:1"><div class="kpi-label">Current</div><div style="font-weight:700">${cur.toFixed(1)}/10</div></div>
        <div style="flex:1"><div class="kpi-label">Peak</div><div style="font-weight:700">${peak.toFixed(1)}/10</div></div>
        <div style="flex:1"><div class="kpi-label">Change</div><div style="font-weight:700">${change>=0?'+':''}${change}%</div></div>
        <div style="flex:1"><div class="kpi-label">Trend</div><div style="font-weight:700;color:${dirColor}">${dir}</div></div>`;
    } else rts.innerHTML = `<div style="color:var(--muted);font-size:12px">Not enough data yet</div>`;
  }

  // ── Protocol chart ──
  const pc = S.stats.protocol_counts || {};
  if (S.charts.proto) {
    S.charts.proto.data.datasets[0].data = [pc.TCP||0, pc.UDP||0, pc.ICMP||0];
    S.charts.proto.update('none');
  }

  // ── Threat Severity — compact distribution (count + % of total, not a raw count bar) ──
  const tb = document.getElementById('threat-bars');
  if (tb) {
    const sevs = ['LOW','MEDIUM','HIGH','CRITICAL'];
    const colors = {'LOW':'var(--green)','MEDIUM':'var(--yellow)','HIGH':'var(--orange)','CRITICAL':'var(--red)'};
    tb.innerHTML = sevs.map(s=>{
      const cnt = sc[s]||0; const pct = total ? (cnt/total*100).toFixed(1) : '0.0';
      return `<div style="margin-bottom:12px;cursor:pointer" onclick="filterEventsBySeverity('${s}')">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          ${sevPill(s)}
          <span style="color:var(--muted);font-size:11px">${cnt} alerts &nbsp;<strong style="color:${colors[s]}">${pct}%</strong></span>
        </div>
        <div class="risk-bar-wrap"><div class="risk-bar" style="width:${pct}%;background:${colors[s]}"></div></div>
      </div>`;
    }).join('');
  }

  // ── Top Threat Sources (from /api/stats top_attackers) — click → IP Intelligence ──
  const ts = document.getElementById('top-sources');
  if (ts) {
    const top = (S.stats.top_attackers||[]).slice(0,5);
    ts.innerHTML = top.length ? top.map((t,i)=>`
      <div class="mini-list-row" onclick="openIpIntel('${t.ip}')">
        <span><span class="mini-list-rank">${i+1}</span><span style="font-family:monospace">${t.ip}</span></span>
        <span style="color:var(--muted);font-size:11px">${t.count} events</span>
      </div>`).join('') : `<div style="color:var(--muted);font-size:12px;padding:8px 0">No data yet</div>`;
  }

  // ── Top Attack Types — click → filters the Events tab to that attack type ──
  const ta = document.getElementById('top-attacks');
  if (ta) {
    const ac = S.stats.attack_type_counts || {};
    const top = Object.entries(ac).filter(([k])=>k!=='Normal').sort((a,b)=>b[1]-a[1]).slice(0,5);
    ta.innerHTML = top.length ? top.map(([type,cnt],i)=>`
      <div class="mini-list-row" onclick="filterEventsByAttack('${type.replace(/'/g,"\\'")}')">
        <span><span class="mini-list-rank">${i+1}</span>${type}</span>
        <span style="color:var(--muted);font-size:11px">${cnt}</span>
      </div>`).join('') : `<div style="color:var(--muted);font-size:12px;padding:8px 0">No attacks observed yet</div>`;
  }

  // ── Attack Analytics table — count + % of attacks + real trend vs the previous poll ──
  const atb = document.getElementById('attack-table-body');
  if (atb) {
    const ac = S.stats.attack_type_counts || {};
    const pac = (S.prevStats && S.prevStats.attack_type_counts) || {};
    const entries = Object.entries(ac).filter(([k])=>k!=='Normal').sort((a,b)=>b[1]-a[1]).slice(0,8);
    const attackTotal = entries.reduce((s,[,c])=>s+c,0) || 1;
    atb.innerHTML = entries.length ? entries.map(([type,cnt])=>{
      const pct = (cnt/attackTotal*100).toFixed(1);
      const prevCnt = pac[type];
      return `<tr style="cursor:pointer" onclick="filterEventsByAttack('${type.replace(/'/g,"\\'")}')">
        <td style="color:var(--orange)">${type}</td>
        <td style="font-weight:700">${cnt}</td>
        <td>${pct}%</td>
        <td style="font-size:11px">${trendReadout(cnt, prevCnt)}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:16px">No attacks observed yet</td></tr>`;
  }

  // ── Live log ──
  const ll = document.getElementById('live-log');
  if (ll) {
    const colors = {LOW:'var(--green)',MEDIUM:'var(--yellow)',HIGH:'var(--orange)',CRITICAL:'var(--red)'};
    ll.innerHTML = S.events.slice(0,20).map((e,i)=>
      `<div class="log-line" style="color:${colors[e.severity]};cursor:pointer" onclick="openEventModal(${i})">[${e.severity}] ${e.src_ip} | ${e.protocol} | Risk=${Math.min(e.risk_score,10).toFixed(1)}/10 | ${e.attack_type}${e.mitre_technique?' | '+e.mitre_technique:''}</div>`
    ).join('');
  }

  // ── Live feed — IP is the primary object, severity pill, risk mini-bar, ⋮ action menu ──
  _feedEvents = S.events.slice(0,15);
  const fb = document.getElementById('live-feed-body');
  if (fb) {
    fb.innerHTML = _feedEvents.map((e,i)=>{
      const mitre  = e.mitre_technique
        ? `<a href="https://attack.mitre.org/techniques/${e.mitre_technique}/" target="_blank" onclick="event.stopPropagation()"
              style="color:var(--accent);font-size:10px;font-family:monospace">${e.mitre_technique}</a>
           <br><span style="font-size:9px;color:var(--muted)">${e.mitre_tactic||''}</span>` : '-';
      const isCritical = e.severity==='CRITICAL' || e.severity==='HIGH';
      const directAction = (isCritical && S.role==='master')
        ? `<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();quickBlock('${e.src_ip}')">${e.severity==='CRITICAL'?'ISOLATE':'BLOCK'}</button>` : '';
      return `<tr>
        <td class="ip-cell" onclick="openIpIntel('${e.src_ip}')">
          <span style="display:flex;align-items:center">
            <span class="status-dot" style="background:${e.blocked?'var(--red)':'var(--green)'}"></span>
            <span>
              <div class="ip-main">${e.src_ip}</div>
              <div class="ip-org">${e.organization||'Unknown'}${e.blocked?' · blocked':''}</div>
            </span>
          </span>
        </td>
        <td>${sevPill(e.severity)}</td>
        <td style="color:${e.attack_type!=='Normal'?'var(--orange)':'var(--muted)'}">${e.attack_type}</td>
        <td>${mitre}</td>
        <td>${riskMini(e.risk_score)}</td>
        <td style="color:var(--muted)">${e.protocol}</td>
        <td style="font-family:monospace;color:var(--muted);font-size:11px">${e.timestamp_str}</td>
        <td style="color:var(--muted)">${e.country}</td>
        <td style="text-align:right;white-space:nowrap">
          ${directAction}
          <span class="action-menu-wrap">
            <button class="action-menu-btn" onclick="event.stopPropagation();toggleActionMenu('am-${i}')">⋮</button>
            <div class="action-menu" id="am-${i}">
              <button onclick="event.stopPropagation();closeAllActionMenus();openEventModal(${i})">View Details</button>
              <button onclick="event.stopPropagation();closeAllActionMenus();quickInvestigate('${e.src_ip}')">Investigate</button>
              <button onclick="event.stopPropagation();closeAllActionMenus();quickThreatHunt('${e.src_ip}')">Threat Hunt</button>
              ${S.role==='master'?`<button class="danger" onclick="event.stopPropagation();closeAllActionMenus();quickBlock('${e.src_ip}')">Block</button>`:''}
              <button onclick="event.stopPropagation();closeAllActionMenus();quickCreateCase('${e.src_ip}','${(e.attack_type||'').replace(/'/g,"\\'")}')">Create Case</button>
            </div>
          </span>
        </td>
      </tr>`;
    }).join('');
  }
}

function toggleActionMenu(id) {
  const el = document.getElementById(id);
  const wasOpen = el.classList.contains('show');
  closeAllActionMenus();
  if (!wasOpen) el.classList.add('show');
}
function closeAllActionMenus() {
  document.querySelectorAll('.action-menu.show').forEach(m=>m.classList.remove('show'));
}

// ════════════════════════════════════════════════
function quickInvestigate(ip) {
  switchTab('risk-explain');
  const inp = document.getElementById('re-ip');
  if (inp) { inp.value = ip; explainRisk(); }
}
function quickThreatHunt(ip) {
  switchTab('hunt');
  quickHunt(ip);
}
async function quickCreateCase(ip, attackType) {
  switchTab('cases');
  await loadCases();
  const t = document.getElementById('case-title'), d = document.getElementById('case-desc'), i = document.getElementById('case-ip');
  if (t) t.value = `Investigation — ${ip}${attackType?' ('+attackType+')':''}`;
  if (d) d.value = attackType ? `Auto-filled from live feed: ${attackType} activity from ${ip}` : `Auto-filled from live feed: activity from ${ip}`;
  if (i) i.value = ip;
  t?.focus();
}
function filterEventsBySeverity(sev) {
  switchTab('events');
  setEvtFilter(sev);
}
function filterEventsByAttack(type) {
  switchTab('events');
  evtSearch = type;
  setEvtFilter('ALL');
  const inp = document.getElementById('evt-search');
  if (inp) inp.value = type;
}

async function openIpIntel(ip) {
  const overlay = document.createElement('div');
  overlay.className = 'ov-backdrop';
  overlay.innerHTML = `<div class="ov-box" style="text-align:center;color:var(--muted);padding:40px">Looking up ${ip}…</div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if (e.target===overlay) overlay.remove(); });

  const ipEvents = S.events.filter(e=>e.src_ip===ip);
  const [ti, risk] = await Promise.all([
    apiFetch(`/threat-intel/ip/${ip}`),
    apiFetch(`/risk/explain/${ip}`),
  ]);
  const org = ipEvents[0]?.organization || ti?.isp || 'Unknown';
  const country = ipEvents[0]?.country || ti?.country || 'Unknown';
  const malicious = ti?.is_malicious;
  const repColor = malicious===true ? 'var(--red)' : malicious===false ? 'var(--green)' : 'var(--muted)';
  const repLabel = malicious===true ? 'MALICIOUS' : malicious===false ? 'CLEAN' : 'UNKNOWN';
  const attackCounts = {};
  ipEvents.forEach(e=>{ if (e.attack_type && e.attack_type!=='Normal') attackCounts[e.attack_type]=(attackCounts[e.attack_type]||0)+1; });
  const protocols = [...new Set(ipEvents.map(e=>e.protocol))];
  const times = ipEvents.map(e=>e.timestamp_str).filter(Boolean);

  const box = overlay.querySelector('.ov-box');
  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
      <div>
        <div style="font-family:monospace;font-size:20px;font-weight:800">${ip}</div>
        <div style="color:var(--muted);font-size:12px;margin-top:2px">${org} · ${country}</div>
      </div>
      <button class="btn btn-sm" onclick="this.closest('.ov-backdrop').remove()">Close</button>
    </div>
    <div class="row" style="gap:10px;margin-bottom:16px">
      <div class="card" style="flex:1;padding:12px;text-align:center">
        <div style="font-size:10px;color:var(--muted);margin-bottom:4px">Reputation</div>
        <span class="pill" style="background:${repColor}20;color:${repColor}"><span class="pill-dot" style="background:${repColor}"></span>${repLabel}</span>
      </div>
      <div class="card" style="flex:1;padding:12px;text-align:center">
        <div style="font-size:10px;color:var(--muted);margin-bottom:4px">Risk Score</div>
        <strong style="font-size:16px">${risk ? risk.final_score+' / 100' : '—'}</strong>
      </div>
      <div class="card" style="flex:1;padding:12px;text-align:center">
        <div style="font-size:10px;color:var(--muted);margin-bottom:4px">Severity</div>
        <strong>${risk ? sevPill(risk.severity) : '—'}</strong>
      </div>
    </div>
    ${ti && ti.is_malicious ? `
    <div style="font-size:11px;color:var(--muted);margin:-8px 0 14px">
      Threat intel confidence <strong style="color:var(--text)">${ti.confidence}%</strong>
      ${ti.threat_types?.length ? ' · ' + ti.threat_types.join(', ') : ''}
      ${ti.reports ? ` · ${ti.reports} reports` : ''}
    </div>` : ''}
    <div class="card-title" style="margin-bottom:8px">Activity</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.8">
      Events&nbsp; <strong style="color:var(--text)">${ipEvents.length}</strong><br>
      First seen (this session)&nbsp; <strong style="color:var(--text)">${times[times.length-1]||'—'}</strong><br>
      Last seen&nbsp; <strong style="color:var(--text)">${times[0]||'—'}</strong><br>
      Protocols&nbsp; <strong style="color:var(--text)">${protocols.join(' / ')||'—'}</strong>
    </div>
    ${Object.keys(attackCounts).length ? `
    <div class="card-title" style="margin-bottom:8px">Attack Associations</div>
    <div style="font-size:12px;margin-bottom:14px">
      ${Object.entries(attackCounts).map(([t,c])=>`<div style="display:flex;justify-content:space-between;padding:3px 0">${t}<strong>${c}</strong></div>`).join('')}
    </div>` : ''}
    <div id="ip-ai-analysis"></div>
    <div class="row" style="gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" onclick="investigateWithAI('${ip}')">🧠 Investigate with AHRAS AI</button>
      <button class="btn btn-sm btn-secondary" onclick="this.closest('.ov-backdrop').remove();quickThreatHunt('${ip}')">Threat Hunt</button>
      ${S.role==='master'?`<button class="btn btn-danger btn-sm" onclick="quickBlock('${ip}')">Block IP</button>`:''}
      <button class="btn btn-sm btn-secondary" onclick="this.closest('.ov-backdrop').remove();quickCreateCase('${ip}')">Create Case</button>
    </div>`;
}

// "Explain with AHRAS AI" — reuses the existing risk-explainer + XAI backend (already-computed
// weighted risk components; this just surfaces it inline instead of requiring a tab switch).
async function investigateWithAI(ip) {
  const el = document.getElementById('ip-ai-analysis');
  if (!el) return;
  el.innerHTML = `<div class="ai-analysis" style="text-align:center;color:var(--muted)">Analysing evidence for ${ip}…</div>`;
  const xai = await apiFetch(`/xai/explain/${ip}`); // full_report: base explanation + counterfactual + confidence
  if (!xai) { el.innerHTML = ''; return; }
  const exp = xai.base_explanation || {};
  const cf = xai.counterfactual;
  const conf = xai.confidence || {};
  const comps = (exp.components||[]).slice().sort((a,b)=>b.contribution-a.contribution).slice(0,4);
  el.innerHTML = `
    <div class="ai-analysis">
      <strong style="color:var(--accent)">🧠 AHRAS AI Analysis</strong><br><br>
      ${exp.verdict||''}<br><br>
      <strong>Primary evidence:</strong><br>
      ${comps.map(c=>`• ${c.label}: ${c.reason||''}`).join('<br>')||'No contributing signals for this IP yet.'}<br><br>
      ${cf ? `<strong>What would lower this to ${cf.target_severity}?</strong><br>${cf.explanation||''}<br><br>` : ''}
      <span style="color:var(--muted)">Confidence: ${conf.overall_confidence!==undefined?Math.round(conf.overall_confidence*100)+'% ('+conf.label+')':'—'}</span>
    </div>`;
}

let evtFilter = 'ALL', evtSearch = '';
function loadEvents() {
  const p = document.getElementById('panel-events');
  p.innerHTML = `
  <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
    <input id="evt-search" placeholder="Search IP, attack, country…" oninput="evtSearch=this.value;renderEventsTable()"

    ${['ALL','LOW','MEDIUM','HIGH','CRITICAL'].map(s=>
      `<button class="pill-btn ${s==='ALL'?'accent':''}" id="efbtn-${s}" onclick="setEvtFilter('${s}')">${s}</button>`
    ).join('')}
    <span style="margin-left:auto;color:var(--muted);font-size:12px" id="evt-count">0 events</span>
  </div>
  <div class="card">
    <div class="tbl-wrap"><table>
      <thead><tr><th>#</th><th>Time</th><th>Source IP</th><th>DNS/Org</th><th>Protocol</th><th>Attack Type</th><th>Threat</th><th>Risk</th><th>Country</th>${S.role==='master'?'<th>Actions</th>':''}</tr></thead>
      <tbody id="events-body"></tbody>
    </table></div>
  </div>`;
  renderEventsTable();
}

function setEvtFilter(f) {
  evtFilter = f;
  document.querySelectorAll('[id^="efbtn-"]').forEach(b=>b.classList.remove('accent'));
  document.getElementById(`efbtn-${f}`).classList.add('accent');
  renderEventsTable();
}

function renderEventsTable() {
  const filtered = S.events.filter(e=>
    (evtFilter==='ALL'||e.severity===evtFilter) &&
    (!evtSearch || e.src_ip.includes(evtSearch)||e.attack_type.toLowerCase().includes(evtSearch.toLowerCase())||e.country.toLowerCase().includes(evtSearch.toLowerCase()))
  );
  const cnt = document.getElementById('evt-count');
  if (cnt) cnt.textContent = `${filtered.length} events`;
  const tb = document.getElementById('events-body');
  if (!tb) return;
  tb.innerHTML = filtered.slice(0,100).map((e,i)=>{
    const rc = e.risk_score>7?'var(--red)':e.risk_score>4?'var(--yellow)':'var(--green)';
    const action = S.role==='master'?`<td><button class="btn btn-danger btn-sm" onclick="quickBlock('${e.src_ip}')">Block</button></td>`:'';
    return `<tr>
      <td style="color:var(--muted)">${i+1}</td>
      <td style="font-family:monospace;color:var(--muted)">${e.timestamp_str}</td>
      <td style="font-family:monospace">${e.src_ip}</td>
      <td style="color:var(--muted)">${e.organization||'Unknown'}</td>
      <td style="color:var(--muted)">${e.protocol}</td>
      <td style="color:${e.attack_type!=='Normal'?'var(--orange)':'var(--muted)'}">${e.attack_type}</td>
      <td><span class="badge b-${e.severity}">${e.severity}</span></td>
      <td style="font-weight:700;color:${rc}">${Math.min(e.risk_score,10).toFixed(1)}</td>
      <td style="color:var(--muted)">${e.country}</td>
      ${action}
    </tr>`;
  }).join('');
}

    data:{labels:aLabels,datasets:[{data:aLabels.map(k=>ac[k]),backgroundColor:'#E3671C88',borderColor:'#E3671C',borderWidth:1,borderRadius:3}]},

  });
  const sc=S.stats.severity_counts||{};const tot=S.events.length||1;
  const hm=document.getElementById('a-heatmap');
  const cols={LOW:'var(--green)',MEDIUM:'var(--yellow)',HIGH:'var(--orange)',CRITICAL:'var(--red)'};
  hm.innerHTML=['LOW','MEDIUM','HIGH','CRITICAL'].map(s=>`
    <div style="background:${cols[s]}15;border:1px solid ${cols[s]}30;border-radius:8px;padding:14px;text-align:center">

      <div style="color:var(--muted);font-size:11px;margin-top:4px">${((sc[s]||0)/tot*100).toFixed(1)}%</div>
    </div>`).join('');
}

async function fwToggle(feat, val) {
  const r = await apiFetch('/firewall/toggle',{method:'POST',body:JSON.stringify({feature:feat,enabled:val})});
  if (r) { showPopup(`${feat} ${val?'enabled':'disabled'}`,'LOW'); loadFirewall(); }
}
async function blockIP() {
  const ip=document.getElementById('fw-ip').value.trim();
  const reason=document.getElementById('fw-reason').value.trim();
  if (!ip) return showPopup('Enter an IP address','MEDIUM');
  const r = await apiFetch('/firewall/block-ip',{method:'POST',body:JSON.stringify({ip,reason})});
  if (r?.success) { showPopup(`IP ${ip} blocked`,'HIGH'); loadFirewall(); }
  else showPopup(r?.reason||'Failed','MEDIUM');
}
async function unblockIP(ip) {
  const r = await apiFetch('/firewall/unblock-ip',{method:'POST',body:JSON.stringify({ip})});
  if (r?.success) { showPopup(`IP ${ip} unblocked`,'LOW'); loadFirewall(); }
}
async function quickBlock(ip) {
  const r = await apiFetch('/firewall/block-ip',{method:'POST',body:JSON.stringify({ip,reason:'Quick block from event feed'})});
  if (r?.success) showPopup(`IP ${ip} blocked`,'HIGH');
  else showPopup(r?.reason||'Blocking disabled — enable firewall first','MEDIUM');
}
async function blockPort() {
  const port=parseInt(document.getElementById('fw-port').value);
  const protocol=document.getElementById('fw-port-proto').value;
  const reason=document.getElementById('fw-port-reason').value;
  if (!port) return showPopup('Enter a port number','MEDIUM');

// POPUP SYSTEM
// ════════════════════════════════════════════════
const _shownPopups = new Set();
function showPopup(msg, level='LOW', type='') {
  const key = `${msg}-${level}`;
  if (_shownPopups.has(key)) return;
  _shownPopups.add(key);
  setTimeout(()=>_shownPopups.delete(key), 5000);

  const cls = level==='CRITICAL'?'critical':level==='HIGH'?'high':level==='MEDIUM'?'medium':'';
  const id = 'popup-'+Date.now();
  const container = document.getElementById('popup-container');
  const el = document.createElement('div');
  el.className = `popup ${cls}`; el.id = id;
  const typeLabel = type ? `<span style="font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.06em">[${type}] </span>` : '';
  el.innerHTML = `
    <button class="popup-close" onclick="document.getElementById('${id}').remove()">×</button>
    <div class="popup-title">${typeLabel}${level} Alert</div>
    <div class="popup-msg">${msg}</div>
    ${(level==='HIGH'||level==='CRITICAL') && S.role==='master' ? `
    <div class="popup-actions">
      <button class="btn btn-sm btn-danger" onclick="document.getElementById('${id}').remove()">Dismiss</button>
      <button class="btn btn-sm btn-primary" onclick="switchTab('firewall');document.getElementById('${id}').remove()">Open Firewall</button>
    </div>` : ''}`;
  container.appendChild(el);
  setTimeout(()=>el.remove(), 8000);
}

  runHunt();

async function addEvidence(caseId) {
  const title = document.getElementById('ev-title').value.trim();
  const data = document.getElementById('ev-data').value.trim();
  const ev_type = document.getElementById('ev-type').value;

  await apiFetch(`/forensics/cases/${caseId}/evidence`, {method:'POST',
    body:JSON.stringify({ev_type, title, description:title, data, source:'analyst'})});
  openForensicCase(caseId);
}

async function addTimelineEvent(caseId) {
  const timestamp = document.getElementById('tl-ts').value.trim() || new Date().toISOString();
  const actor = document.getElementById('tl-actor').value.trim();
  const action = document.getElementById('tl-action').value.trim();
  const target = document.getElementById('tl-target').value.trim();
  const description = document.getElementById('tl-desc').value.trim();

  await apiFetch(`/forensics/cases/${caseId}/timeline`, {method:'POST',
    body:JSON.stringify({timestamp, actor, action, target, description})});
  openForensicCase(caseId);
}

async function addNote(caseId) {
  const title = document.getElementById('note-title').value.trim();
  const body = document.getElementById('note-body').value.trim();
  if (!title || !body) { alert('Title and body are required'); return; }
  await apiFetch(`/forensics/cases/${caseId}/notes`, {method:'POST',
    body:JSON.stringify({title, body})});
  openForensicCase(caseId);
}

      Enter a source IP to see a full breakdown of every factor driving its risk score. This is the research feature — most systems show only a number; AHRAS explains each component.
    </div>
    <div class="row" style="gap:10px;align-items:flex-end">
      <input id="re-ip" class="inp" placeholder="Source IP (e.g. 192.168.1.100)" style="flex:2"
             onkeydown="if(event.key==='Enter')explainRisk()">
      <button class="btn btn-primary" onclick="explainRisk()">Explain Risk</button>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      ${['10.0.0.1','192.168.1.100','172.16.0.50'].map(ip=>

async function explainRisk() {
  const ip = document.getElementById('re-ip').value.trim();
  if (!ip) return;
  const el = document.getElementById('risk-explain-result');
  el.innerHTML = `<div style="text-align:center;color:var(--muted);padding:24px">Analysing ${ip}...</div>`;
  const res = await apiFetch(`/risk/explain/${ip}`);
  if (!res) return;
  const {final_score, severity, components=[], adjustments=[], verdict, recommendations=[]} = res;
  const sevColor = severity==='CRITICAL'?'var(--crit)':severity==='HIGH'?'var(--high)':severity==='MEDIUM'?'var(--warn)':'var(--ok)';
  el.innerHTML = `
  <div class="card" style="border:2px solid ${sevColor}">
    <div class="row" style="align-items:center;gap:16px;margin-bottom:20px">
      <div style="font-size:52px;font-weight:800;color:${sevColor}">${final_score}</div>
      <div>
        <div style="font-size:20px;font-weight:700;color:${sevColor}">${severity}</div>
        <div style="font-size:12px;color:var(--muted)">Risk Score for ${ip}</div>
      </div>
    </div>
    <div style="background:var(--bg2);padding:12px;border-radius:8px;margin-bottom:20px;font-size:13px">${verdict}</div>

    <div class="card-title" style="margin-bottom:12px">Score Breakdown</div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
    ${components.map(c=>{
      const pct = Math.round((c.contribution/c.weight)*100);
      const barW = Math.max(2, Math.round(c.contribution));
      const cColor = pct>=70?'var(--crit)':pct>=40?'var(--high)':pct>=15?'var(--warn)':'var(--ok)';
      return `<div>
        <div class="row" style="justify-content:space-between;margin-bottom:4px">
          <span style="font-size:12px;font-weight:600">${c.label}</span>
          <span style="font-size:13px;font-weight:800;color:${cColor}">${c.contribution.toFixed(1)} / ${c.weight} pts</span>
        </div>
        <div style="background:var(--bg2);border-radius:4px;height:8px;overflow:hidden">
          <div style="width:${barW}%;height:100%;background:${cColor};border-radius:4px;transition:width 0.4s"></div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">${c.reason}</div>
        <div style="font-size:10px;color:var(--muted)">${c.detail}</div>
      </div>`;
    }).join('')}
    </div>

    ${adjustments.length?`
    <div class="card-title" style="margin-bottom:8px">Adjustments Applied</div>
    <div style="margin-bottom:20px">
    ${adjustments.map(a=>`<div style="font-size:12px;padding:6px 10px;background:var(--bg2);border-radius:6px;margin-bottom:6px">
      <strong>${a.label}</strong>: <span style="color:${a.value>=0?'var(--crit)':'var(--ok)'}">${a.value>=0?'+':''}${a.value} pts</span>
      <div style="color:var(--muted);font-size:11px">${a.reason}</div>
    </div>`).join('')}
    </div>`:''}

    <div class="card-title" style="margin-bottom:8px">Recommendations</div>
    <div>
    ${recommendations.map((r,i)=>`<div style="font-size:12px;padding:6px 10px;background:var(--bg2);border-radius:6px;margin-bottom:6px">
      <span style="color:var(--accent);font-weight:700">${i+1}.</span> ${r}
    </div>`).join('')}
    </div>
  </div>`;
}

  const r = await apiFetch('/ioc', {method:'POST', body:JSON.stringify(body)});

async function deleteIOC(id) {

  await apiFetch(`/ioc/${id}`, {method:'DELETE'});

}

  const t = document.getElementById('case-title').value.trim();
  if (!t) return;
  const body = {
    title: t,
    description: document.getElementById('case-desc').value.trim() || t,
    priority: document.getElementById('case-priority').value,
    affected_ips: document.getElementById('case-ip').value.trim() ? [document.getElementById('case-ip').value.trim()] : [],
  };

  overlay.innerHTML = `

      <div><strong style="font-size:16px">${c.case_id}</strong> — ${c.title}</div>
      <button class="btn btn-sm" onclick="this.closest('[style*=fixed]').remove()">Close</button>
    </div>
    <div class="row" style="gap:12px;margin-bottom:16px">

    <div class="card" style="margin-bottom:12px;padding:12px"><div style="font-size:11px;color:var(--muted);margin-bottom:4px">Description</div>${c.description}</div>
    ${c.mitre_technique?`<div class="card" style="margin-bottom:12px;padding:12px;background:#4A90D910">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px">MITRE ATT&CK</div>
      <strong style="font-family:monospace;color:var(--accent)">${c.mitre_technique}</strong> — ${c.mitre_tactic}
    </div>`:''}
    <div class="card" style="margin-bottom:12px;padding:12px">
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Timeline (${c.notes.length} notes)</div>

        <div style="font-size:10px;color:var(--muted)">${n.timestamp} — ${n.author} [${n.note_type}]</div>
        <div style="font-size:12px;margin-top:2px">${n.content}</div>

      <button class="btn btn-primary" onclick="addCaseNote('${id}')">Add Note</button>
      ${S.role==='master'?`<button class="btn btn-sm" onclick="updateCaseStatus('${id}','IN_INVESTIGATION')">Investigate</button>

}

async function addCaseNote(id) {
  const content = document.getElementById(`note-content-${id}`)?.value?.trim();
  if (!content) return;
  await apiFetch(`/cases/${id}/notes`, {method:'POST', body:JSON.stringify({content,note_type:'note'})});
  document.querySelectorAll('[style*=fixed]').forEach(el=>el.remove());
  loadCases();
}

async function updateCaseStatus(id, status) {
  await apiFetch(`/cases/${id}/status`, {method:'POST', body:JSON.stringify({status})});
  document.querySelectorAll('[style*=fixed]').forEach(el=>el.remove());
  loadCases();
}

async function closeCase(id) {
  if (!confirm('Close this case?')) return;
  await apiFetch(`/cases/${id}/close`, {method:'POST', body:JSON.stringify({})});
  loadCases();
}

    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      ${['185.220.101.1','45.33.32.156','5.188.86.172','malware.test','phishing.test',
         '44d88612fea8a8f36de82e1278abb02f']
        .map(q=>`<button class="btn btn-sm btn-secondary" onclick="quickTI('${q}')">${q}</button>`).join('')}
    </div>
  </div>
  <div id="ti-result"></div>`;
}

function quickTI(q) {
  document.getElementById('ti-indicator').value = q;
  if (q.match(/^\d+\.\d+/)) document.getElementById('ti-type').value = 'ip';
  else if (q.length === 32 || q.length === 64) document.getElementById('ti-type').value = 'hash';
  else document.getElementById('ti-type').value = 'domain';
  runTI();
}

async function runTI() {
  const q = document.getElementById('ti-indicator').value.trim();
  const t = document.getElementById('ti-type').value;
  if (!q) return;
  const r = document.getElementById('ti-result');
  r.innerHTML = `<div style="text-align:center;color:var(--muted);padding:24px">Checking threat intelligence...</div>`;
  const res = await apiFetch(`/threat-intel/${t}/${encodeURIComponent(q)}`);
  if (!res) return;
  const color = res.is_malicious ? 'var(--red)' : 'var(--green)';
  const verdict = res.is_malicious ? 'MALICIOUS' : 'CLEAN';
  r.innerHTML = `
  <div class="card">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
      <div style="font-size:36px">${''}</div>
      <div>
        <div style="font-size:24px;font-weight:800;color:${color}">${verdict}</div>
        <div style="font-family:monospace;font-size:14px;color:var(--text)">${res.indicator}</div>
      </div>
    </div>
    <div class="row" style="gap:12px;margin-bottom:16px">
      ${metricCard('Confidence', `${res.confidence}%`, color)}
      ${metricCard('Reports', res.reports||0, 'var(--orange)')}
      ${metricCard('Source', res.source, 'var(--accent)')}
      ${metricCard('Country', res.country||'Unknown', 'var(--muted)')}
    </div>
    ${res.threat_types?.length?`<div style="margin-bottom:12px">
      <span style="font-size:11px;color:var(--muted)">Threat Types: </span>
      ${res.threat_types.map(t=>`<span class="badge" style="background:#f8514920;color:var(--red);margin-right:4px">${t}</span>`).join('')}
    </div>`:''}
    ${res.isp?`<div style="font-size:12px;color:var(--muted)">ISP: ${res.isp}</div>`:''}
    ${res.last_seen?`<div style="font-size:12px;color:var(--muted)">Last Seen: ${res.last_seen}</div>`:''}
    ${res.is_malicious?`<div style="margin-top:16px">
      <button class="btn btn-danger" onclick="blockFromTI('${res.indicator}')">Block IP</button>
      <button class="btn btn-primary" onclick="addIOCFromTI(${JSON.stringify(res).replace(/"/g,'&quot;')})">Add to IOC</button>
    </div>`:''}
  </div>`;
}

async function blockFromTI(ip) {
  await apiFetch('/firewall/block-ip', {method:'POST', body:JSON.stringify({ip,reason:'Threat Intel hit'})});
  showPopup(`Blocked ${ip}`, 'HIGH');
}

async function addIOCFromTI(ti) {
  await apiFetch('/ioc', {method:'POST', body:JSON.stringify({
    indicator: ti.indicator, ioc_type: ti.indicator_type,
    threat_level: ti.confidence>=80?'critical':ti.confidence>=50?'high':'medium',
    description: `TI Hit: ${ti.threat_types?.join(', ')||'Unknown'}`,
    source: ti.source,
  })});
  showPopup(`IOC added: ${ti.indicator}`, 'LOW');
}

async function addAsset() {
  const body = {
    name: document.getElementById('a-name').value.trim(),
    ip: document.getElementById('a-ip').value.trim(),
    asset_type: document.getElementById('a-type').value,
    criticality: parseInt(document.getElementById('a-crit').value),
    owner: document.getElementById('a-owner').value.trim(),
    description: '',
  };
  if (!body.name || !body.ip) return;
  const r = await apiFetch('/assets', {method:'POST', body:JSON.stringify(body)});
  if (r) { showPopup(`Asset added: ${body.name}`, 'LOW'); loadAssets(); }
}

async function deleteAsset(id) {
  if (!confirm('Remove this asset?')) return;
  await apiFetch(`/assets/${id}`, {method:'DELETE'});
  loadAssets();
}

function lookupAssetTI(ip) {
  document.getElementById('ti-indicator') && (document.getElementById('ti-indicator').value = ip);
  switchTab('threat-intel');
  setTimeout(runTI, 100);
}

      The YARA scanner flags <strong>.dll / .exe / .jar</strong> files from Eclipse, Gradle, JDK
      as <em>SuspiciousShellcode</em>. These are <strong style="color:var(--green)">false positives</strong>
      — legitimate developer tools contain binary patterns that match generic YARA rules.<br><br>
      <strong style="color:var(--text)">Fix:</strong> Go to <strong>Virus/AV</strong> tab → toggle off,
      or add exclusion paths in <code>detection/virus_engine.py</code> under <code>EXCLUDED_PATHS</code>.
    </div>
  </div>`;
}

async function clearData(target) {
  const labels = {events:'all events',alerts:'all alerts',correlations:'all incidents',
                  cases:'all cases',all:'EVERYTHING'};
  if (!confirm(`Clear ${labels[target]}? This cannot be undone.`)) return;
  const r = await apiFetch('/maintenance/clear', {method:'POST', body:JSON.stringify({target})});
  if (r) {
    showPopup(`Cleared: ${r.cleared.join(', ')}`, 'LOW');
    loadMaintenance();
    if (target==='all' || target==='events') S.events=[];
  }
}

</script>
